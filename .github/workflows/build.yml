name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Build APK (kivy/buildozer Docker)
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
          kivy/buildozer \
          android debug 2>&1 | tee /tmp/buildozer.log
      timeout-minutes: 90

    - name: Fix permissions
      if: always()
      run: sudo chown -R "$USER:$USER" . || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StockDashboard-APK
        path: bin/*.apk
        if-no-files-found: error

    - name: Upload build log (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/buildozer.log
        if-no-files-found: ignore
