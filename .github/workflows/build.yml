name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          libffi-dev libssl-dev python3-dev \
          build-essential libltdl-dev

    - name: Setup Android SDK (licenses auto-accepted)
      uses: android-actions/setup-android@v3

    - name: Install Android NDK and build tools
      run: |
        sdkmanager "ndk;25.2.9519653" "build-tools;34.0.0" "platforms;android-34"

    - name: Create sdkmanager wrapper (buildozer old-path compatibility)
      run: |
        mkdir -p $ANDROID_HOME/tools/bin
        echo "#!/bin/bash" > $ANDROID_HOME/tools/bin/sdkmanager
        echo "exec $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \"\$@\"" \
          >> $ANDROID_HOME/tools/bin/sdkmanager
        chmod +x $ANDROID_HOME/tools/bin/sdkmanager

    - name: Install Buildozer
      run: pip install buildozer cython

    - name: Build APK
      env:
        ANDROIDSDK: ${{ env.ANDROID_HOME }}
        ANDROIDNDK: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
      run: buildozer android debug 2>&1 | tail -300
      timeout-minutes: 60

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StockDashboard-APK
        path: bin/*.apk
        if-no-files-found: error
