name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          libffi-dev libssl-dev python3-dev \
          build-essential libltdl-dev

    - name: Setup Android SDK (licenses auto-accepted)
      uses: android-actions/setup-android@v3

    - name: Install required Android packages
      run: |
        sdkmanager "build-tools;34.0.0" "platforms;android-34" \
                   "platform-tools" "ndk;25.2.9519653"

    - name: Install Buildozer
      run: pip install buildozer cython

    - name: Build APK
      env:
        ANDROIDSDK: ${{ env.ANDROID_HOME }}
        ANDROIDNDK: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        ANDROIDAPI: "34"
        ANDROIDMINAPI: "21"
      run: buildozer android debug 2>&1 | tail -300
      timeout-minutes: 60

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StockDashboard-APK
        path: bin/*.apk
        if-no-files-found: error
