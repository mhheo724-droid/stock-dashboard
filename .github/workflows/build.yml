name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          libffi-dev libssl-dev python3-dev \
          build-essential libltdl-dev

    - name: Setup Android SDK (licenses auto-accepted)
      uses: android-actions/setup-android@v3

    - name: Install Android build-tools, platform, NDK
      run: |
        sdkmanager \
          "build-tools;34.0.0" \
          "platforms;android-34" \
          "platform-tools" \
          "ndk;25.2.9519653"

    - name: Wire Android SDK/NDK into buildozer expected paths
      run: |
        mkdir -p ~/.buildozer/android/platform

        # buildozer 가 찾는 android-sdk 경로를 pre-installed SDK로 심링크
        ln -sf "$ANDROID_HOME" ~/.buildozer/android/platform/android-sdk

        # buildozer 가 찾는 NDK 경로 심링크 (r25b = 25.2.9519653)
        ln -sf "$ANDROID_HOME/ndk/25.2.9519653" \
               ~/.buildozer/android/platform/android-ndk-r25b

        # buildozer 가 old-style tools/bin/sdkmanager 로 호출하므로 래퍼 생성
        mkdir -p "$ANDROID_HOME/tools/bin"
        printf '#!/bin/bash\nexec "%s/cmdline-tools/latest/bin/sdkmanager" "$@"\n' \
          "$ANDROID_HOME" > "$ANDROID_HOME/tools/bin/sdkmanager"
        chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"

        # 확인 출력
        echo "--- SDK structure check ---"
        ls "$ANDROID_HOME/build-tools/"
        ls "$ANDROID_HOME/platforms/"
        ls "$ANDROID_HOME/ndk/"
        echo "---------------------------"

    - name: Install Buildozer
      run: pip install buildozer cython

    - name: Build APK
      run: buildozer android debug 2>&1 | tail -300
      timeout-minutes: 60

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StockDashboard-APK
        path: bin/*.apk
        if-no-files-found: error
